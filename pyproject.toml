[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-bricks-softwarecenter"
version = "1.2.0"
description = "Lightweight, local-first PySide6 desktop shortcut organizer and application launcher."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "file-bricks" }
]
keywords = [
    "app-launcher",
    "desktop-organizer",
    "pyside6",
    "shortcut-manager",
    "python",
    "local-first",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/file-bricks/SoftwareCenter"
Repository = "https://github.com/file-bricks/SoftwareCenter"
Documentation = "https://github.com/file-bricks/SoftwareCenter#readme"
Issues = "https://github.com/file-bricks/SoftwareCenter/issues"
Changelog = "https://github.com/file-bricks/SoftwareCenter/blob/master/CHANGELOG.md"
Security = "https://github.com/file-bricks/SoftwareCenter/blob/master/SECURITY.md"
"Parent Organization" = "https://github.com/file-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "dist",
    "build",
    "_WARTUNG",
    "releases",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
