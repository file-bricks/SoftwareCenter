[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-bricks-softwarecenter"
version = "1.2.0"
description = "Lightweight, local-first PySide6 desktop shortcut organizer and application launcher."
readme = "README.md"
license = { text = "MIT" }
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_LICENSES.md",
    "THIRD_PARTY_LICENSES.txt",
]
requires-python = ">=3.10"
authors = [
    { name = "file-bricks", email = "support@lukasgeiger.com" }
]
keywords = [
    "app-launcher",
    "desktop-organizer",
    "pyside6",
    "shortcut-manager",
    "python",
    "local-first",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
    "Pillow>=12.3.0",
]
build = [
    "PyInstaller>=6.10.0",
    "altgraph>=0.17.4",
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/file-bricks/SoftwareCenter"
Repository = "https://github.com/file-bricks/SoftwareCenter"
Documentation = "https://github.com/file-bricks/SoftwareCenter#readme"
Issues = "https://github.com/file-bricks/SoftwareCenter/issues"
"Bug Tracker" = "https://github.com/file-bricks/SoftwareCenter/issues"
Changelog = "https://github.com/file-bricks/SoftwareCenter/blob/master/CHANGELOG.md"
Security = "https://github.com/file-bricks/SoftwareCenter/blob/master/SECURITY.md"
Notice = "https://github.com/file-bricks/SoftwareCenter/blob/master/NOTICE"
"Parent Organization" = "https://github.com/file-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"LLM Ready" = "https://github.com/file-bricks/SoftwareCenter/blob/master/llms.txt"
"Third-Party Licenses" = "https://github.com/file-bricks/SoftwareCenter/blob/master/THIRD_PARTY_LICENSES.md"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "dist",
    "build",
    "_WARTUNG",
    "releases",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "UP009", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*_platform_smoke.py" = ["E402"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v"
pythonpath = "."
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "_WARTUNG",
    "releases",
]
