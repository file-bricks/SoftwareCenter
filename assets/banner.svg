<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      .subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: -0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 11.5px;
        letter-spacing: 0.5px;
      }
      .mono-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
      }
    </style>
    
      <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#051329"/>
        <stop offset="50%" stop-color="#0a2540"/>
        <stop offset="100%" stop-color="#030c1a"/>
      </linearGradient>
      <linearGradient id="scAccent" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#6366f1"/>
      </linearGradient>
      <linearGradient id="scTile" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
      </linearGradient>
      <filter id="scGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    
  </defs>
  
  
      <g transform="translate(880, 50)">
        <!-- App Hub Container -->
        <rect x="0" y="0" width="240" height="240" rx="24" fill="#0c1a30" stroke="url(#scAccent)" stroke-width="2" opacity="0.95" filter="url(#scGlow)"/>
        
        <!-- App Tiles Grid (2x2) -->
        <g transform="translate(25, 25)">
          <!-- Tile 1: Dev / Terminal -->
          <rect x="0" y="0" width="85" height="85" rx="14" fill="url(#scTile)" stroke="#38bdf8" stroke-width="1.5"/>
          <path d="M 22 35 L 35 42.5 L 22 50" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="42" y1="50" x2="60" y2="50" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="70" cy="18" r="4" fill="#38bdf8"/>
          
          <!-- Tile 2: Media / Graphics -->
          <rect x="105" y="0" width="85" height="85" rx="14" fill="url(#scTile)" stroke="#818cf8" stroke-width="1.5"/>
          <circle cx="137" cy="32" r="8" fill="#818cf8" opacity="0.6"/>
          <polygon points="120,65 140,45 155,58 175,38 180,65" fill="#818cf8" opacity="0.8"/>
          
          <!-- Tile 3: Data / DB -->
          <rect x="0" y="105" width="85" height="85" rx="14" fill="url(#scTile)" stroke="#a855f7" stroke-width="1.5"/>
          <ellipse cx="42" cy="130" rx="24" ry="8" fill="none" stroke="#a855f7" stroke-width="2"/>
          <path d="M 18 130 v 15 c 0 4.4 10.7 8 24 8 s 24 -3.6 24 -8 v -15" fill="none" stroke="#a855f7" stroke-width="2"/>
          <path d="M 18 145 v 15 c 0 4.4 10.7 8 24 8 s 24 -3.6 24 -8 v -15" fill="none" stroke="#a855f7" stroke-width="2"/>
          
          <!-- Tile 4: System / Launcher -->
          <rect x="105" y="105" width="85" height="85" rx="14" fill="url(#scTile)" stroke="#34d399" stroke-width="1.5"/>
          <circle cx="147" cy="147" r="16" fill="none" stroke="#34d399" stroke-width="2"/>
          <polygon points="143,138 156,147 143,156" fill="#34d399"/>
        </g>
        
        <!-- Connecting network signals -->
        <circle cx="25" cy="120" r="3" fill="#38bdf8" filter="url(#scGlow)"/>
        <circle cx="215" cy="120" r="3" fill="#818cf8" filter="url(#scGlow)"/>
      </g>
    
  
    <g transform="translate(80, 85)">
      <!-- Badge -->
      <g>
        <rect width="135" height="28" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-width="1.2"/>
        <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
        <text x="26" y="18" class="badge-text" fill="#7dd3fc">FILE-BRICKS</text>
      </g>
      
      <!-- Title -->
      <text x="0" y="85" class="title" fill="#ffffff" font-size="52">SoftwareCenter</text>
      
      <!-- Subtitle -->
      <text x="0" y="125" class="subtitle" fill="#94a3b8" font-size="20">Desktop Application Hub &amp; Categorized Shortcut Launcher</text>
      
      <!-- Feature Pills -->
      <g transform="translate(0, 160)">
        <g transform="translate(0, 0)">
          <rect width="155" height="32" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="77" y="20" text-anchor="middle" class="pill-text" fill="#7dd3fc">🗂️ Tab Categories</text>
        </g>
        <g transform="translate(167, 0)">
          <rect width="145" height="32" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#7dd3fc">⚡ Quick Launch</text>
        </g>
        <g transform="translate(324, 0)">
          <rect width="155" height="32" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="77" y="20" text-anchor="middle" class="pill-text" fill="#7dd3fc">☁️ Cloud Backup</text>
        </g>
      </g>
    </g>
    
</svg>